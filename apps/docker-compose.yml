services:
  postgres:
    image: postgres:17-alpine
    container_name: enchantress-postgres
    environment:
      POSTGRES_USER: enchantress
      POSTGRES_PASSWORD: enchantress
      POSTGRES_DB: enchantress
    ports:
      - "5432:5432"
    volumes:
      - enchantress-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enchantress -d enchantress"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  enchantress-postgres:
