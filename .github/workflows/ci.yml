name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Auto-fix lint/format, commit back as github-actions[bot] (push to main only)
      - run: pnpm exec biome check --write
      - name: Commit fixes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: auto-fix lint & format"; git push; }

      - run: pnpm lint
      - run: pnpm build
